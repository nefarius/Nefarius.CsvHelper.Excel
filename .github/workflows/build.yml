name: .NET

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.library-framework }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        library-framework: [netstandard2.0, netstandard2.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore -p:LibraryTargetFramework=${{ matrix.library-framework }}

      - name: Build selected library asset and both test runtimes
        run: dotnet build -c Release --no-restore -p:GeneratePackageOnBuild=false -p:LibraryTargetFramework=${{ matrix.library-framework }}

      - name: Test on .NET 8 and .NET 10
        run: >-
          dotnet test src/CsvHelper.Excel.Specs/CsvHelper.Excel.Specs.csproj
          -c Release --no-build --no-restore
          -p:LibraryTargetFramework=${{ matrix.library-framework }}
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ matrix.library-framework }}
          path: TestResults/

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Modify README.md for NuGet
        run: |
          sed -i 's/# <img[^>]*>/# /' README.md
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ref="${GITHUB_REF_NAME}"
          else
            ref="${GITHUB_SHA}"
          fi
          base="https://github.com/nefarius/Nefarius.CsvHelper.Excel/blob/${ref}"
          sed -i \
            -e "s|](LICENSE)|](${base}/LICENSE)|" \
            -e "s|](docs/index.md)|](${base}/docs/index.md)|" \
            README.md

      - name: Pack
        run: dotnet pack src/CsvHelper.Excel/CsvHelper.Excel.csproj -c Release -p:GeneratePackageOnBuild=false --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*.*nupkg
          if-no-files-found: error
