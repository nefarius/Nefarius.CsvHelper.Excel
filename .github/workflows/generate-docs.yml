name: Generate API Documentation

on:
  push:
    branches: [master]
    paths:
      - 'src/CsvHelper.Excel/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.config/dotnet-tools.json'
      - '.github/workflows/generate-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore documentation tool
        run: dotnet tool restore

      - name: Build
        run: dotnet build src/CsvHelper.Excel/CsvHelper.Excel.csproj -c Release -p:GeneratePackageOnBuild=false

      - name: Generate API docs
        run: dotnet tool run xmldoc2md ./bin/CsvHelper.Excel/Release/netstandard2.0/Nefarius.CsvHelper.Excel.dll ./docs/

      - name: Commit and push documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update API documentation"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
